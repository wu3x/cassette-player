<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Side A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Arabic:wght@400;600&amp;family=Instrument+Sans:wght@600&amp;display=swap">
<style id="page-css">
/* Layout: a single black cassette centered on a bare field. Admin lives in an invisible top-left hotspot. */
:root{
  --bg:#f2f2ef;
  --ink:#161616;
  --on-ink:#f6f6f3;
  --paper:#fbfbf9;
  --paper-2:#f4f4f1;
  --muted:#85857f;
  --track:#cacac4;
  --shell-1:#2c2c2d;
  --shell-2:#0d0d0e;
  --rim:rgba(255,255,255,.08);
  --plate-1:#242425;
  --plate-2:#131314;
  --btn:#9a978e;
  --btn-dark:#4b4a47;
  --btn-ink:#f7f5ee;
  --green:#5cc46b;
  --teal:#4cb59f;
  --blue:#3f7de0;
  --shadow:rgba(0,0,0,.34);
  --panel:#ffffff;
  --panel-ink:#161616;
  --panel-muted:#6b6b66;
  --line:#d9d9d4;
  --scrim:rgba(10,10,10,.46);
  --danger:#b3261e;
  --ok:#1d7a3c;
  --display:"Instrument Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --arabic:"IBM Plex Sans Arabic","Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0f;
    --ink:#f1f1ee;
    --on-ink:#131313;
    --shell-1:#3c3c3e;
    --shell-2:#171718;
    --rim:rgba(255,255,255,.14);
    --shadow:rgba(0,0,0,.7);
    --panel:#1b1b1c;
    --panel-ink:#f1f1ee;
    --panel-muted:#a2a29c;
    --line:#38383a;
    --scrim:rgba(0,0,0,.62);
    --danger:#ff8a80;
    --ok:#6fd48f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0f;
  --ink:#f1f1ee;
  --on-ink:#131313;
  --shell-1:#3c3c3e;
  --shell-2:#171718;
  --rim:rgba(255,255,255,.14);
  --shadow:rgba(0,0,0,.7);
  --panel:#1b1b1c;
  --panel-ink:#f1f1ee;
  --panel-muted:#a2a29c;
  --line:#38383a;
  --scrim:rgba(0,0,0,.62);
  --danger:#ff8a80;
  --ok:#6fd48f;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  font-family:var(--display);
}
.stage{min-height:100%;display:grid;place-items:center;padding-block:24px}
.deck{container-type:inline-size;width:min(100%,560px)}

/* cassette shell */
.cassette{
  position:relative;
  width:100%;
  aspect-ratio:850/540;
  border-radius:4.4cqw;
  background:linear-gradient(158deg,var(--shell-1),var(--shell-2) 58%);
  box-shadow:
    0 0 0 1px var(--rim),
    inset 0 0 0 .5cqw #000,
    inset 0 .7cqw .9cqw rgba(255,255,255,.07),
    0 7cqw 9cqw -4cqw var(--shadow),
    0 1.2cqw 2.6cqw rgba(0,0,0,.28);
}
.cassette::before{
  content:"";position:absolute;inset:1.7cqw;border-radius:3.2cqw;
  box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.07);pointer-events:none;
}
.screw{
  position:absolute;width:2.8cqw;height:2.8cqw;border-radius:50%;
  background:
    linear-gradient(45deg,transparent 44%,#0a0a0a 44% 56%,transparent 56%),
    linear-gradient(-45deg,transparent 44%,#0a0a0a 44% 56%,transparent 56%),
    radial-gradient(circle at 35% 30%,#666,#1c1c1c 72%);
  box-shadow:0 0 0 .25cqw #050505;
}
.s1{left:2.9cqw;top:3.2cqw}.s2{left:94.3cqw;top:3.2cqw}
.s3{left:2.9cqw;top:57.6cqw}.s4{left:94.3cqw;top:57.6cqw}

/* label */
.label{
  position:absolute;left:8.5cqw;top:6.4cqw;width:83cqw;height:38.6cqw;
  border-radius:2.6cqw;background:var(--paper);
  box-shadow:inset 0 0 0 .35cqw rgba(0,0,0,.06),0 .3cqw .7cqw rgba(0,0,0,.4);
}
.paper{
  position:absolute;inset:1.4cqw;border-radius:1.8cqw;background:var(--paper-2);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}
.head{
  position:absolute;left:6cqw;right:6cqw;top:4.4cqw;
  display:flex;justify-content:space-between;align-items:center;
}
.mono{font-family:var(--mono);font-weight:500;font-size:max(9px,2.2cqw);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.pill{
  font-family:var(--mono);font-weight:500;font-size:max(9px,2.2cqw);letter-spacing:.2em;
  background:#101010;color:#f4f4f1;border-radius:99px;padding:.9cqw 2.8cqw;
}
.name{
  position:absolute;left:6cqw;right:6cqw;top:9.2cqw;margin:0;
  font-family:var(--display);font-weight:600;font-size:max(15px,4.4cqw);line-height:1.25;
  color:#171717;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seek{
  position:absolute;left:6cqw;top:calc(16.6cqw - 14px);width:calc(100% - 12cqw);height:28px;
  appearance:none;-webkit-appearance:none;background:transparent;margin:0;padding:0;cursor:pointer;--pp:0%;
}
.seek::-webkit-slider-runnable-track{height:max(3px,.6cqw);border-radius:99px;background:linear-gradient(to right,#1a1a1a var(--pp),var(--track) var(--pp))}
.seek::-moz-range-track{height:max(3px,.6cqw);border-radius:99px;background:linear-gradient(to right,#1a1a1a var(--pp),var(--track) var(--pp))}
.seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:max(18px,3.4cqw);height:max(18px,3.4cqw);border-radius:50%;background:#fff;border:0;
  margin-top:calc((max(3px,.6cqw) - max(18px,3.4cqw)) / 2);
  box-shadow:0 .2cqw .8cqw rgba(0,0,0,.38),0 0 0 1px rgba(0,0,0,.07);
}
.seek::-moz-range-thumb{width:max(18px,3.4cqw);height:max(18px,3.4cqw);border-radius:50%;background:#fff;border:0;box-shadow:0 .2cqw .8cqw rgba(0,0,0,.38),0 0 0 1px rgba(0,0,0,.07)}
.seek:focus-visible{outline:2px solid #3f7de0;outline-offset:2px;border-radius:6px}
.seek:disabled{opacity:.45;cursor:default}
.stripes{position:absolute;left:1.4cqw;right:1.4cqw;top:24.8cqw;display:flex;flex-direction:column}
.stripes i{display:block}
.stripes i:nth-child(1){height:1.2cqw;background:var(--green)}
.stripes i:nth-child(2){height:1.2cqw;background:var(--teal)}
.stripes i:nth-child(3){height:1.4cqw;background:var(--blue)}
.time{position:absolute;top:27.1cqw;transform:translateY(-50%);font-family:var(--mono);font-weight:500;font-size:max(9px,2.6cqw);letter-spacing:.04em;color:#222;font-variant-numeric:tabular-nums}
.t-cur{left:6cqw}.t-dur{right:6cqw}
.window{position:absolute;left:50%;top:21.2cqw;width:51.8cqw;height:auto;transform:translateX(-50%);display:block;overflow:visible}

/* mechanics */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.6s linear infinite;animation-play-state:paused}
.ticks{animation:tick 1.2s linear infinite;animation-play-state:paused}
.playing .spin,.playing .ticks{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tick{to{transform:translateX(-22px)}}

/* deck plate and buttons */
.plate{
  position:absolute;left:50%;bottom:0;width:47cqw;height:17.4cqw;transform:translateX(-50%);
  clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);
  background:linear-gradient(var(--plate-1),var(--plate-2));
}
.controls{position:absolute;left:50%;bottom:2cqw;transform:translateX(-50%);display:flex;align-items:center;gap:2.2cqw}
.btn{
  position:relative;appearance:none;-webkit-appearance:none;border:0;padding:0;margin:0;cursor:pointer;
  display:grid;place-items:center;border-radius:50%;color:var(--btn-ink);
  width:8.2cqw;height:8.2cqw;background:var(--btn-dark);
  box-shadow:inset 0 .25cqw .4cqw rgba(255,255,255,.14),0 .3cqw .6cqw rgba(0,0,0,.5);
  transition:transform .12s ease,filter .12s ease;
}
.btn::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.btn.main{width:10.4cqw;height:10.4cqw;background:var(--btn)}
.btn svg{width:48%;height:48%;display:block}
.btn:active:not(:disabled){transform:scale(.94)}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:focus-visible{outline:2px solid #3f7de0;outline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}

/* hidden admin hotspot */
.gate{
  position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);
  width:64px;height:64px;padding:0;margin:0;border:0;background:transparent;opacity:0;cursor:default;z-index:5;
  -webkit-tap-highlight-color:transparent;
}
.gate:focus-visible{opacity:.6;outline:2px solid var(--muted);outline-offset:-6px;border-radius:12px}

/* lyrics under the cassette */
.lyrics{
  margin-top:5cqw;height:32cqw;display:grid;align-content:center;justify-items:center;gap:1.8cqw;
  text-align:center;font-family:var(--arabic);overflow:hidden;
}
.ly{margin:0;max-width:100%}
.ly.prev,.ly.next{
  font-size:max(13px,3.5cqw);line-height:1.3;min-height:1.3em;color:var(--muted);opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ly.cur{font-size:max(17px,5cqw);line-height:1.35;min-height:1.35em;font-weight:600;color:var(--ink);text-wrap:balance}
.ly.cur.pop{animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(.9cqw)}to{opacity:1;transform:none}}

/* admin sheet */
.sheet{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--scrim);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.card{
  width:min(100%,380px);max-height:100%;overflow:auto;direction:rtl;text-align:right;
  background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:20px;
  font-family:var(--arabic);font-size:15px;line-height:1.55;
  box-shadow:0 20px 50px rgba(0,0,0,.35),0 0 0 1px var(--line);
}
.card form{display:grid;gap:14px}
.card h2{margin:0;font-size:18px;font-weight:600}
.card p{margin:0;color:var(--panel-muted);font-size:14px}
.field{display:grid;gap:6px}
.field>span,.pick-title{font-size:14px;font-weight:600}
.card input[type=password],.card input[type=text]{
  width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;
  background:var(--panel);color:var(--panel-ink);font:inherit;font-size:16px;
}
.card input:focus-visible{outline:2px solid #3f7de0;outline-offset:1px}
.pick{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;
  border:1px dashed var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;
}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pick:focus-within{outline:2px solid #3f7de0;outline-offset:1px}
.pick-name{color:var(--panel-muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.pick-act{font-weight:600;font-size:14px;white-space:nowrap}
.row{display:flex;gap:10px}
.cbtn{
  flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--panel-ink);
  font:inherit;font-weight:600;cursor:pointer;
}
.cbtn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cbtn:disabled{opacity:.55;cursor:default}
.cbtn:focus-visible{outline:2px solid #3f7de0;outline-offset:2px}
.card textarea{
  width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  background:var(--panel);color:var(--panel-ink);font:inherit;font-size:16px;line-height:1.6;resize:vertical;
}
.card textarea:focus-visible{outline:2px solid #3f7de0;outline-offset:1px}
.link{
  justify-self:start;background:none;border:0;padding:4px 0;margin:0;color:var(--panel-muted);
  font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;
}
.syncbox{display:grid;gap:14px}
.syncline{
  min-height:7em;display:grid;gap:8px;align-content:center;text-align:center;padding:14px;
  border:1px solid var(--line);border-radius:14px;
}
.syncline .big{font-size:20px;font-weight:600;line-height:1.4}
.syncline .dim{color:var(--panel-muted);font-size:14px;min-height:1.4em}
.tap{
  height:76px;border-radius:16px;border:0;background:var(--ink);color:var(--on-ink);
  font:inherit;font-size:20px;font-weight:600;cursor:pointer;
}
.tap:disabled{opacity:.4;cursor:default}
.tap:active:not(:disabled){transform:scale(.98)}
.tap:focus-visible{outline:2px solid #3f7de0;outline-offset:2px}
.msg{min-height:1.4em;font-size:14px;color:var(--panel-muted)}
.msg.bad{color:var(--danger)}
.msg.good{color:var(--ok)}
.shake{animation:shake .32s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){
  .spin,.ticks,.shake,.ly.cur.pop{animation:none}
  .btn{transition:none}
}
</style>

<button class="gate" id="gate" type="button" aria-label="إدارة الكاسيت"></button>

<div id="root"></div><div id="yt-holder" style="position:fixed;bottom:0;right:0;width:210px;height:118px;z-index:2;display:none;background:#111"></div>

<script>
(async function(){
'use strict';
const URL_BASE='https://bmnavmgriuvgxikwlanj.supabase.co';
const PUBLIC_KEY='sb_publishable_mEf2hfww2TAgx7k1kjdYfw_ZR7ygae4';

function youtubeId(url){try{const u=new URL(url);let host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return u.pathname.slice(1).split('/')[0];if(['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(host)){if(u.pathname==='/watch')return u.searchParams.get('v');let m=u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/);return m&&m[1];}}catch(e){}return null;}
function parseLrc(raw){const result=[];String(raw||'').split(/\r?\n/).forEach(line=>{const matches=[...line.matchAll(/\[(\d+):(\d{2})(?:[.:](\d{1,3}))?\]/g)];const txt=line.replace(/\[\d+:\d{2}(?:[.:]\d{1,3})?\]/g,'').trim();matches.forEach(m=>result.push([+m[1]*60 + +m[2]+(m[3]?Number('0.'+m[3]):0),txt]));});return result.sort((a,b)=>a[0]-b[0]);}
function toLrc(rows){return rows.map(([t,line])=>'['+String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(2).padStart(5,'0')+'] '+line).join('\n');}
function renderLyrics(t){if(!lyrics.length)return;let i=-1;for(let j=0;j<lyrics.length;j++){if(lyrics[j][0]<=t)i=j;else break;}if(i===lastIndex)return;lastIndex=i;$('lyPrev').textContent=i>0?lyrics[i-1][1]:'';$('lyCur').textContent=i>=0?lyrics[i][1]:'';$('lyNext').textContent=lyrics[i+1]?.[1]||'';}
function duration(){return mode==='youtube'?(youtubePlayer?.getDuration?.()||0):(audio.duration||0);}

function paint(){let d=duration(),t=currentTime(),p=d>0&&isFinite(d)?Math.min(1,t/d):0;seek.value=Math.round(p*1000);seek.style.setProperty('--pp',p*100+'%');tCur.textContent=fmt(t);tDur.textContent=fmt(d);$('packL').setAttribute('r',(47-9*p).toFixed(2));$('packR').setAttribute('r',(38+9*p).toFixed(2));renderLyrics(t);}

window.onYouTubeIframeAPIReady=()=>{if(ytId)loadYouTube(ytId);};
function apply(row){settings=row||{};audio.pause();setPlaying(false);const url=String(settings.audio_url||'').trim();const id=youtubeId(url);mode=id?'youtube':'file';if(mode==='youtube'){audio.removeAttribute('src');loadYouTube(id);}else{if(youtubePlayer?.stopVideo)youtubePlayer.stopVideo();document.getElementById('yt-holder').style.display='none';audio.src=url||'';audio.load();}const title=String(settings.title||'').trim();nameEl.textContent=title|| (id?'YouTube':'لا يوجد شريط بعد');fmtEl.textContent=id?'YOUTUBE':(url?(FMT[settings.mime]||'AUDIO'):'—');$('play').disabled=!url;$('restart').disabled=!url;seek.disabled=!url;lyrics=Array.isArray(settings.lyrics)?settings.lyrics:parseLrc(settings.lyrics);$('lyrics').hidden=!lyrics.length;lastIndex=-2;paint();}
async function refresh(){if(!db){nameEl.textContent='تعذّر تحميل الاتصال';return;}const {data,error}=await db.from('cassette_settings').select('*').eq('id',1).maybeSingle();if(error){console.error(error);nameEl.textContent='تعذّر تحميل الكاسيت';return;}apply(data);}

pwForm.onsubmit=async e=>{e.preventDefault();msg($('pwMsg'),'جارٍ تسجيل الدخول...');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});$('pw').value='';if(error){msg($('pwMsg'),'فشل تسجيل الدخول. تحقق من البريد وكلمة المرور.',true);return;}await showEditor();};

function storagePath(file){return 'tracks/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+(file.name.split('.').pop()||'mp3').replace(/[^a-z0-9]/gi,'');}
editForm.onsubmit=async e=>{e.preventDefault();const save=$('save');save.disabled=true;msg($('editMsg'),'جارٍ الحفظ...');try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('انتهت الجلسة. سجّل الدخول مجدداً.');let url=String(settings.audio_url||'');let mime=settings.mime||'audio/mpeg';const f=$('file').files[0],yt=$('youtubeIn').value.trim();if(f&&yt)throw Error('اختر ملفاً أو رابط يوتيوب، وليس الاثنين معاً.');if(yt){if(!youtubeId(yt))throw Error('رابط يوتيوب غير صحيح.');url=yt;mime='youtube';}else if(f){if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|wav|ogg)$/i.test(f.name))throw Error('اختر ملفاً صوتياً.');if(f.size>45*1024*1024)throw Error('الحد الأقصى للملف 45 ميجابايت.');const path=storagePath(f);const {error:upErr}=await db.storage.from('cassette-audio').upload(path,f,{contentType:f.type||'audio/mpeg',upsert:false});if(upErr)throw upErr;url=db.storage.from('cassette-audio').getPublicUrl(path).data.publicUrl;mime=f.type||'audio/mpeg';}if(!url)throw Error('اختر ملفاً أو ضع رابط يوتيوب.');const rows=parseLrc($('lyr').value);if($('lyr').value.trim()&&!rows.length)throw Error('الكلمات تحتاج توقيت LRC أو اتركها فارغة.');const update={title:$('titleIn').value.trim(),audio_url:url,lyrics:$('lyr').value.trim()};const {error}=await db.from('cassette_settings').update(update).eq('id',1);if(error)throw error;msg($('editMsg'),'تم الحفظ بنجاح. سيظهر للزوار عند تحديث الصفحة.');await refresh();}catch(err){console.error(err);msg($('editMsg'),err.message||'فشل الحفظ.',true);}finally{save.disabled=false;}};
await refresh();
})();
