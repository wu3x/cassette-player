/* Layout: a single black cassette centered on a bare field. Admin lives in an invisible top-left hotspot. */

  --paper:#fbfbf9;
  --paper-2:#f4f4f1;
  --muted:#85857f;

  --shell-2:#0d0d0e;
  --rim:rgba(255,255,255,.08);
  --plate-1:#242425;
  --plate-2:#131314;
  --btn:#9a978e;
  --btn-dark:#4b4a47;
  --btn-ink:#f7f5ee;
  --green:#5cc46b;
  --teal:#4cb59f;
  --blue:#3f7de0;
  --shadow:rgba(0,0,0,.34);

}

  position:relative;

  border-radius:4.4cqw;

.head{

.seek:focus-visible{outline:2px solid #3f7de0;outline-offset:2px;border-radius:6px}

.stripes{position:absolute;left:1.4cqw;right:1.4cqw;top:24.8cqw;display:flex;flex-direction:column}

.t-cur{left:6cqw}.t-dur{right:6cqw}
.window{position:absolute;left:50%;top:21.2cqw;width:51.8cqw;height:auto;transform:translateX(-50%);display:block;overflow:visible}

/* mechanics */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.6s linear infinite;animation-play-state:paused}
.ticks{animation:tick 1.2s linear infinite;animation-play-state:paused}
.playing .spin,.playing .ticks{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tick{to{transform:translateX(-22px)}}

/* deck plate and buttons */
.plate{
  position:absolute;left:50%;bottom:0;width:47cqw;height:17.4cqw;transform:translateX(-50%);
  clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);
  background:linear-gradient(var(--plate-1),var(--plate-2));
}
.controls{position:absolute;left:50%;bottom:2cqw;transform:translateX(-50%);display:flex;align-items:center;gap:2.2cqw}
.btn{
  position:relative;appearance:none;-webkit-appearance:none;border:0;padding:0;margin:0;cursor:pointer;
  display:grid;place-items:center;border-radius:50%;color:var(--btn-ink);

.btn::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.btn.main{width:10.4cqw;height:10.4cqw;background:var(--btn)}

/* hidden admin hotspot */

  width:64px;height:64px;padding:0;margin:0;border:0;background:transparent;opacity:0;cursor:default;z-index:5;
  -webkit-tap-highlight-color:transparent;
}
.gate:focus-visible{opacity:.6;outline:2px solid var(--muted);outline-offset:-6px;border-radius:12px}

/* lyrics under the cassette */
.lyrics{
  margin-top:5cqw;height:32cqw;display:grid;align-content:center;justify-items:center;gap:1.8cqw;
  text-align:center;font-family:var(--arabic);overflow:hidden;

.ly{margin:0;max-width:100%}
.ly.prev,.ly.next{
  font-size:max(13px,3.5cqw);line-height:1.3;min-height:1.3em;color:var(--muted);opacity:.75;

.ly.prev,.ly.next{transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.ly.cur.ly-enter{animation:lyric-glide .85s cubic-bezier(.22,1,.36,1) both}

/* Preview controls, visible only to the administrator. */
.previewbar{position:fixed;z-index:12;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));max-width:520px;margin:auto;padding:12px;background:var(--panel);color:var(--panel-ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 35px #0004;direction:rtl;font-family:var(--arabic)}
.previewbar strong{display:block;text-align:center;margin-bottom:9px;font-size:14px}
.previewbar .row{display:flex;gap:8px}.previewbar .cbtn{font-size:13px;min-width:0}
.previewbar .msg{text-align:center;font-size:12px}
/* admin sheet */
.sheet{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--scrim);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.card{
  width:min(100%,380px);max-height:100%;overflow:auto;direction:rtl;text-align:right;
  background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:20px;

.field>span,.pick-title{font-size:14px;font-weight:600}

  width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;

}

  position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;

@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

function apply(row,{temporary=false}={}){if(!temporary)settings=row||{};const display=row||{};studioPaint(temporary?(display.studio||studio):studioFromRow(display));audio.pause();setPlaying(false);const url=String(display.audio_url||'').trim();if(url){audio.src=url;audio.load();}else{audio.removeAttribute('src');audio.load();}const title=String(display.title||'').trim();nameEl.textContent=title||'لا يوجد شريط بعد';fmtEl.textContent=url?(FMT[display.mime]||'AUDIO'):'—';$('play').disabled=!url;$('restart').disabled=!url;seek.disabled=!url;lyrics=Array.isArray(display.lyrics)?display.lyrics:parseLrc(display.lyrics);$('lyrics').hidden=!lyrics.length;if(!lyrics.length){$('lyrics').classList.remove('before-first');$('lyPrev').textContent='';$('lyCur').textContent='';$('lyNext').textContent='';}lastIndex=-2;paint();}
// Read the public cassette independently of the administrator's login session.
// A logged-in session may have different RLS permissions from a public visitor.
async function refresh(){
  if(previewActive)return true;
  try{
    const response=await fetch(URL_BASE+'/rest/v1/cassette_settings?id=eq.1&select=*',{
      headers:{apikey:PUBLIC_KEY,Accept:'application/json'},cache:'no-store'
    });
    if(!response.ok)throw Error('HTTP '+response.status+': '+(await response.text()).slice(0,250));
    const rows=await response.json();
    if(!Array.isArray(rows)||!rows.length){
      console.warn('Public cassette row not visible: check SELECT grants and RLS policies for anon.');
      nameEl.textContent='لا يوجد شريط بعد';
      return false;
    }
    if(previewActive)return true;
    apply(rows[0]);return true;
  }catch(error){
    console.error('Cassette public read failed:',error);
    if(!previewActive)nameEl.textContent='تعذّر تحميل الكاسيت';return false;
  }
}

// Admin-only discovery. Public playback and database are untouched.
function soundcloudUrl(raw){try{const u=new URL(raw.trim());return u.protocol==='https:'&&/(^|\\.)soundcloud\\.com$/i.test(u.hostname)&&u.pathname.split('/').filter(Boolean).length>=2;}catch{return false;}}
$('scPreview').onclick=()=>{
 const url=$('scUrlIn').value.trim();
 if(!soundcloudUrl(url)){msg($('musicMsg'),'ألصق رابط أغنية SoundCloud كاملًا، مثل soundcloud.com/artist/track.',true);return;}
 if(!window.SC?.Widget){msg($('musicMsg'),'تعذر تحميل أداة SoundCloud. تحقق من الاتصال ثم أعد المحاولة.',true);return;}
 if(previewActive)endPreview();
 audio.pause();scPreviewMode=true;scReady=false;scPosition=0;scDuration=0;previewActive=true;previewDraft=null;
 $('scEmbed').replaceChildren();
 const frame=document.createElement('iframe');frame.title='SoundCloud';frame.width='100%';frame.height='110';frame.style.border='0';frame.allow='autoplay';frame.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(url)+'&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false';
 $('scEmbed').append(frame);$('scEmbedWrap').hidden=false;

 scWidget.bind(window.SC.Widget.Events.READY,()=>{if(!scPreviewMode)return;scReady=true;scWidget.getDuration(ms=>{scDuration=ms/1000||0;paint();});scWidget.getCurrentSound(sound=>{if(sound?.title)nameEl.textContent=sound.title;});$('previewMsg').textContent='جاهز. اضغط تشغيل على الكاسيت. بعض المقاطع تمنع التضمين.';});
 scWidget.bind(window.SC.Widget.Events.PLAY,()=>{if(scPreviewMode)setPlaying(true);});
 scWidget.bind(window.SC.Widget.Events.PAUSE,()=>{if(scPreviewMode)setPlaying(false);});
 scWidget.bind(window.SC.Widget.Events.FINISH,()=>{if(scPreviewMode){setPlaying(false);scPosition=0;paint();}});
 scWidget.bind(window.SC.Widget.Events.PLAY_PROGRESS,e=>{if(scPreviewMode){scPosition=(e.currentPosition||0)/1000;paint();}});
 scWidget.bind(window.SC.Widget.Events.ERROR,()=>{if(scPreviewMode)msg($('previewMsg'),'المقطع غير متاح للتضمين أو تعذر تشغيله. جرّب رابطًا آخر.',true);});
 setPlaying(false);nameEl.textContent='معاينة SoundCloud';fmtEl.textContent='SC';$('play').disabled=false;$('restart').disabled=false;seek.disabled=false;
 sheet.hidden=true;$('previewbar').hidden=false;$('publishPreview').hidden=true;$('previewMsg').textContent='جارٍ تجهيز مشغّل SoundCloud...';
};

let musicSearchNonce=0;
$('musicSearch').onclick=async()=>{
 const q=$('musicQuery').value.trim(),results=$('musicResults');results.replaceChildren();
 if(!q){msg($('musicMsg'),'اكتب اسم الأغنية أو الفنان.',true);return;}
 const nonce=++musicSearchNonce;
 $('musicTubidy').href='https://m.tubidy.llc/search.php?q='+encodeURIComponent(q);
 $('musicSoundcloud').href='https://soundcloud.com/search?q='+encodeURIComponent(q);
 $('musicAudiomack').href='https://audiomack.com/search?q='+encodeURIComponent(q);
 msg($('musicMsg'),'جارٍ البحث عن معاينات...');
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),9000);
  let response;
  try{response=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&entity=song&media=music&limit=20',{signal:controller.signal});}
  finally{clearTimeout(timeout);}
  if(!response.ok)throw Error('Search unavailable');
  const data=await response.json();if(nonce!==musicSearchNonce)return;
  const hits=(data.results||[]).filter(x=>x.previewUrl&&/^https:\/\//.test(x.previewUrl));
  if(!hits.length){msg($('musicMsg'),'ما لقينا معاينات. جرّب روابط البحث الخارجية أو ارفع ملفًا مصرحًا به.');return;}
  hits.forEach(hit=>{
   const item=document.createElement('div');item.className='music-hit';
   const title=document.createElement('strong');title.textContent=hit.trackName||'بدون عنوان';
   const artist=document.createElement('small');artist.textContent=hit.artistName||'';
   const row=document.createElement('div');row.className='row';
   const listen=document.createElement('button');listen.type='button';listen.className='cbtn';listen.textContent='▶ استماع';
   const choose=document.createElement('button');choose.type='button';choose.className='cbtn primary';choose.textContent='اختيار للمعاينة';
   let sample;
   listen.onclick=async()=>{if(!sample)sample=new Audio(hit.previewUrl);if(sample.paused){try{await sample.play();listen.textContent='⏸ إيقاف';}catch{msg($('musicMsg'),'تعذر تشغيل المقطع.',true);}}else{sample.pause();listen.textContent='▶ استماع';}};
   choose.onclick=()=>{if(sample)sample.pause();$('file').value='';$('fileName').textContent='ملف صوتي، حتى 45 ميجابايت';$('audioUrlIn').value=hit.previewUrl;$('titleIn').value=[hit.artistName,hit.trackName].filter(Boolean).join(' — ').slice(0,80);msg($('musicMsg'),'تم اختيار المقطع التجريبي. اضغط «معاينة قبل النشر» لتجربته على الكاسيت. لا تنشر دون إذن مناسب.');};
   row.append(listen,choose);item.append(title,artist,row);results.append(item);
  });
  msg($('musicMsg'),'نتائج تجريبية قصيرة، وليست أغاني كاملة.');
 }catch(e){if(nonce===musicSearchNonce)msg($('musicMsg'),'تعذر الاتصال بمصدر المعاينات من المتصفح. روابط المنصات للبحث الخارجي فقط، ويمكنك رفع ملف أو إدخال رابط صوت مباشر.',true);}
};
$('musicQuery').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('musicSearch').click();}});

let syncLines=[],syncTimes=[],syncPosition=0;
function syncDraw(){ $('syncMeta').textContent=(syncPosition+1)+' / '+syncLines.length;$('syncLine').textContent=syncLines[syncPosition]||'اكتملت المزامنة';$('syncNext').textContent=syncLines[syncPosition+1]||'';$('syncTap').disabled=syncPosition>=syncLines.length||!syncAudioReady;}
$('syncBtn').onclick=()=>{const raw=$('lyr').value.trim();syncLines=raw.split(/\r?\n/).map(x=>x.replace(/\[\d+:\d{2}(?:[.:]\d{1,3})?\]/g,'').trim()).filter(Boolean);if(!syncLines.length){msg($('editMsg'),'اكتب كلمات الأغنية أولاً، كل سطر لحاله.',true);return;}syncTimes=[];syncPosition=0;syncAudioReady=false;$('syncStart').textContent='▶ تشغيل الصوت';$('syncPause').disabled=true;editForm.hidden=true;$('syncBox').hidden=false;syncDraw();syncProgress();};
let syncAudioReady=false;
function syncProgress(){if($('syncBox').hidden)return;const d=Number.isFinite(audio.duration)?audio.duration:0,t=audio.currentTime||0;$('syncClock').textContent=fmt(t)+' / '+fmt(d);$('syncSeek').disabled=!d;$('syncSeek').value=d?Math.round(t/d*1000):0;$('syncPause').disabled=!syncAudioReady;$('syncPause').textContent=audio.paused?'▶ متابعة':'⏸ إيقاف مؤقت';}
audio.addEventListener('timeupdate',syncProgress);audio.addEventListener('loadedmetadata',syncProgress);audio.addEventListener('pause',syncProgress);audio.addEventListener('play',syncProgress);
$('syncStart').onclick=async()=>{const direct=$('audioUrlIn').value.trim(),f=$('file').files[0];if(f&&direct){alert('اختر ملفًا أو رابطًا فقط.');return;}if(!syncAudioReady){const url=direct||(f?URL.createObjectURL(f):settings.audio_url);if(!url){alert('حدد الأغنية أولاً.');return;}if(f){if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=url;}audio.pause();audio.src=url;audio.load();syncAudioReady=true;syncDraw();}else{audio.pause();audio.currentTime=0;}try{await audio.play();$('syncStart').textContent='↺ من البداية';syncProgress();}catch(e){alert('تعذر التشغيل: '+e.message);}};
$('syncPause').onclick=async()=>{if(!syncAudioReady)return;if(audio.paused){try{await audio.play();}catch(e){alert('تعذر التشغيل: '+e.message);}}else audio.pause();syncProgress();};
$('syncSeek').oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number($('syncSeek').value)/1000;syncProgress();};
$('syncTap').onclick=()=>{if(syncPosition>=syncLines.length||!syncAudioReady||audio.paused)return;syncTimes.push([audio.currentTime,syncLines[syncPosition]]);syncPosition++;syncDraw();if(syncPosition===syncLines.length){audio.pause();syncAudioReady=false;$('lyr').value=toLrc(syncTimes);$('syncBox').hidden=true;editForm.hidden=false;msg($('editMsg'),'اكتملت المزامنة! تقدر تعدّل الأوقات في مربع الكلمات، ثم تعاينها.');}};
$('syncUndo').onclick=()=>{if(syncPosition>0){syncPosition--;syncTimes.pop();syncDraw();}};
$('syncCancel').onclick=()=>{audio.pause();syncAudioReady=false;$('syncBox').hidden=true;apply(settings);if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null;}editForm.hidden=false;};
function storagePath(file){return 'tracks/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+(file.name.split('.').pop()||'mp3').replace(/[^a-z0-9]/gi,'');}
function releasePreviewAssets(){if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null;}}
function endPreview(restore=true){
  $('publishPreview').hidden=false;
  if(scPreviewMode){scWidget?.pause();scWidget=null;scPreviewMode=false;scReady=false;scPosition=0;scDuration=0;$('scEmbed').replaceChildren();$('scEmbedWrap').hidden=true;}
  previewActive=false;$('previewbar').hidden=true;audio.pause();
  if(restore)apply(settings);
  releasePreviewAssets();previewDraft=null;
}
function draftFromForm(){
  const file=$('file').files[0]||null,direct=$('audioUrlIn').value.trim();
  if(file&&direct)throw Error('اختر ملفاً أو رابطاً صوتياً، وليس الاثنين.');
  if(direct&&!validAudioUrl(direct))throw Error('الرابط يجب أن يكون رابطاً مباشراً لملف صوتي.');
  if(file&&(!file.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|wav|ogg)$/i.test(file.name)))throw Error('اختر ملفاً صوتياً صالحاً.');
  if(file&&file.size>45*1024*1024)throw Error('الملف يتجاوز 45 ميجابايت.');
  const lyrics=$('lyr').value.trim();
  if(lyrics&&!parseLrc(lyrics).length)throw Error('الكلمات تحتاج توقيت LRC صحيح.');
  if(!direct&&!file&&!settings.audio_url)throw Error('اختر أغنية أو ضع رابطاً مباشراً.');
  const url=direct||(file?URL.createObjectURL(file):String(settings.audio_url||''));
  const mime=file?(file.type||'audio/mpeg'):(direct?/\.m4a(?:[?#]|$)/i.test(direct)?'audio/mp4':/\.ogg(?:[?#]|$)/i.test(direct)?'audio/ogg':'audio/mpeg':settings.mime||'audio/mpeg');
  return {title:$('titleIn').value.trim(),lyrics,file,direct,url,mime,studio:studioFromForm()};
}
$('previewBtn').onclick=()=>{
  if(scPreviewMode)endPreview(false);
  try{
    const draft=draftFromForm();
    if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null;}previewDraft=draft;
    if(draft.file)previewObjectUrl=draft.url;
    previewActive=true;apply({title:draft.title,audio_url:draft.url,mime:draft.mime,lyrics:draft.lyrics,studio:draft.studio},{temporary:true});
    sheet.hidden=true;$('previewbar').hidden=false;$('previewMsg').textContent='اضغط تشغيل على الكاسيت لتجربة الأغنية.';
  }catch(err){msg($('editMsg'),err.message,true);}
};
$('backPreview').onclick=()=>{endPreview();sheet.hidden=false;pwForm.hidden=true;editForm.hidden=false;};
$('cancelPreview').onclick=()=>{endPreview();close();};
$('publishPreview').onclick=async()=>{
  if(scPreviewMode){msg($('previewMsg'),'معاينة SoundCloud فقط؛ النشر يتطلب ملفًا صوتيًا أو رابط ملف مباشر تملك حق استخدامه.',true);return;}
  if(!previewActive||!previewDraft)return;
  if(!confirm('هل تريد حفظ الأغنية ونشرها الآن لجميع الزوار؟'))return;
  $('publishPreview').disabled=true;msg($('previewMsg'),'جارٍ النشر...');await publishDraft();
};
editForm.onsubmit=e=>{e.preventDefault();msg($('editMsg'),'استخدم زر «معاينة قبل النشر» أولاً.',true);};
async function publishDraft(){const save=$('save');save.disabled=true;msg($('editMsg'),'جارٍ الحفظ...');try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('انتهت الجلسة. سجّل الدخول مجدداً.');let url=String(settings.audio_url||'');let mime=settings.mime||'audio/mpeg';const f=previewDraft.file,direct=previewDraft.direct;if(f&&direct)throw Error('اختر ملفاً أو رابطاً صوتياً مباشراً، وليس الاثنين معاً.');if(direct){if(!validAudioUrl(direct))throw Error('أدخل رابط HTTP أو HTTPS مباشر لملف صوتي، وليس رابط يوتيوب أو صفحة مشاركة.');url=direct;mime=/\.m4a(?:[?#]|$)/i.test(direct)?'audio/mp4':/\.ogg(?:[?#]|$)/i.test(direct)?'audio/ogg':'audio/mpeg';}else if(f){if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|wav|ogg)$/i.test(f.name))throw Error('اختر ملفاً صوتياً.');if(f.size>45*1024*1024)throw Error('الحد الأقصى للملف 45 ميجابايت.');const path=storagePath(f);const {error:upErr}=await db.storage.from('cassette-audio').upload(path,f,{contentType:f.type||'audio/mpeg',upsert:false});if(upErr)throw upErr;url=db.storage.from('cassette-audio').getPublicUrl(path).data.publicUrl;mime=f.type||'audio/mpeg';}if(!url)throw Error('اختر ملفاً أو ضع رابطاً مباشراً لملف صوتي.');const rows=parseLrc(previewDraft.lyrics);if(previewDraft.lyrics.trim()&&!rows.length)throw Error('الكلمات تحتاج توقيت LRC أو اتركها فارغة.');const update={title:previewDraft.title,audio_url:url,lyrics:previewDraft.lyrics};const selected=previewDraft.studio;const changed=Object.keys(defaultStudio).some(k=>selected[k]!==studioFromRow(settings)[k]);if(changed){const {error:columnCheck}=await db.from('cassette_settings').select('studio_style,studio_theme,studio_shell,studio_button,studio_stripe1,studio_stripe2,studio_stripe3').eq('id',1).limit(1);if(columnCheck)throw Error('لتنشر الشكل الجديد، نفّذ ملف SQL المرفق أولاً. لم يتم نشر أي تغيير.');for(const k of Object.keys(defaultStudio))update['studio_'+k]=selected[k];}const {data:updated,error}=await db.from('cassette_settings').update(update).eq('id',1).select('id,title,audio_url');
if(error)throw error;
if(!updated?.length)throw Error('لم يتم تعديل سجل الكاسيت. تحقق من صلاحيات UPDATE وسياسة RLS.');
previewActive=false;const visible=await refresh();
if(!visible||settings.audio_url!==url){
  throw Error('تم تحديث السجل، لكن القراءة العامة لم تُظهر الأغنية الجديدة. تحقق من صلاحيات SELECT لدور anon وسياسة RLS.');
}
endPreview(false);close();}catch(err){console.error(err);if(previewDraft){previewActive=true;apply({title:previewDraft.title,audio_url:previewDraft.url,mime:previewDraft.mime,lyrics:previewDraft.lyrics,studio:previewDraft.studio},{temporary:true});}msg($('previewMsg'),err.message||'فشل الحفظ.',true);}finally{save.disabled=false;$('publishPreview').disabled=false;}}
await refresh();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!previewActive&&audio.paused)refresh();});
})();
</script>
